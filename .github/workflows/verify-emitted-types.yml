name: Verify emitted .d.ts against TS 5.1

# Fragment of the Tests pipeline — PR-only by decision (2026-07-14): the
# merged PR already verified the emitted types; no trunk re-run.
on:
  workflow_call:
    inputs:
      hot-prebuilt:
        description: 'A shared ES+CJS build artifact (handsontable/tmp incl. downleveled types) is available — skip install+build'
        type: boolean
        default: false

jobs:
  type-emit-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # https://github.com/pnpm/action-setup/releases/tag/v6.0.8
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # https://github.com/actions/setup-node/releases/tag/v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # PR pipeline: the shared ES+CJS artifact already contains tmp/ with the
      # downleveled .d.ts (the es-cjs build job runs downlevel:types) — the whole
      # install+build (~7 min) is skipped; the checks below run on the artifact.
      - name: Download the Handsontable ES + CJS build artifact
        if: inputs.hot-prebuilt
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: handsontable-build-es-cjs
      - name: Extract the prebuilt tmp
        if: inputs.hot-prebuilt
        run: tar -zxf tmp.tar.gz ./handsontable/tmp && rm tmp.tar.gz
      - run: pnpm install --frozen-lockfile
        if: ${{ !inputs.hot-prebuilt }}
      - name: Build Handsontable (includes downlevel:types)
        if: ${{ !inputs.hot-prebuilt }}
        run: npm run build --prefix handsontable
      - name: Type-check downleveled .d.ts with pinned TS 5.1.6
        run: |
          cd handsontable
          node -e "
            const fs = require('fs');
            fs.writeFileSync('tsconfig.verify-types.json', JSON.stringify({
              compilerOptions: {
                noEmit: true,
                target: 'es2015',
                lib: ['es2015','es2016','es2017','es2020','esnext','dom','dom.iterable'],
                moduleResolution: 'node',
                strict: true,
                skipLibCheck: false
              },
              include: ['tmp/**/*.d.ts']
            }, null, 2));
          "
          npx -y -p typescript@5.1.6 tsc -p tsconfig.verify-types.json
          rm tsconfig.verify-types.json
      - name: Check package exports and well-formedness (publint)
        run: |
          cd handsontable/tmp
          npx -y publint@0.3.21
      - name: Check type-declaration resolution (attw)
        run: |
          cd handsontable/tmp
          # Ignored rules rationale:
          # false-export-default  — Babel CJS interop artefact: index.js uses
          #                         exports.__esModule=true so .default is reachable
          #                         at runtime for all esModuleInterop:true consumers.
          # untyped-resolution    — dist/ UMD bundles and languages/ files intentionally
          #                         ship no type declarations.
          # no-resolution         — CSS and theme-asset exports have no JS/TS to resolve.
          npx -y @arethetypeswrong/cli@0.18.3 --pack . --format table \
            --ignore-rules false-export-default untyped-resolution no-resolution
