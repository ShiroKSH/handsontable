name: Tests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - 'master'
      - 'develop'
  workflow_dispatch:
    inputs:
      test-all:
        description: 'Test all?'
        type: boolean
        default: false
  workflow_call:
    inputs:
      test-all:
        description: 'Test all?'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pillar 1 enforcement: source changed ⇒ a matching test changed, and new E2E
  # is Playwright (a new Jasmine *.spec.js is flagged). Warn mode — it reports
  # via the job summary but does not block. Flip to block in a later change once
  # the suite is proven. Needs only node + git history, no build.
  test-presence-gate:
    name: "[CHECK] Test presence"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          fetch-depth: 0
      - name: Evaluate test-presence gate (warn)
        run: node .github/scripts/test-presence-gate.mjs | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GATE_MODE: warn
          GATE_BASE: ${{ github.event.pull_request.base.sha }}
      - name: Detect weakened specs (warn)
        run: node .github/scripts/test-weakening-gate.mjs | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha }}

  # Functional Playwright E2E (tests/e2e). Runs inside the pinned Playwright
  # container so the engine + browsers match local and baseline generation
  # exactly; the version here tracks the tests/ package (bump together).
  # Consumes the UMD build artifact — the fixture serves handsontable/dist.
  test-e2e-playwright:
    name: "[TEST] E2E (Playwright)"
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    needs: [ check-scope, build-handsontable-umd ]
    if: |
      needs.check-scope.outputs.run-all == 'true' ||
      needs.check-scope.outputs.build-handsontable-umd == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2

      - name: Download the Handsontable UMD build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # https://github.com/actions/download-artifact/releases/tag/v8.0.0
        with:
          name: handsontable-build-umd

      - run: tar -zxf dist.tar.gz ./handsontable/dist ./handsontable/styles && rm dist.tar.gz

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # https://github.com/pnpm/action-setup/releases/tag/v6.0.8
        name: Install pnpm

      # tests/ is a pnpm workspace member (catalog-pinned Playwright, matching the
      # container tag above). Install only its subtree — npm must not be used here,
      # the monorepo is pnpm-managed.
      - name: Install the Playwright test package
        run: pnpm install --filter handsontable-tests

      - name: Run Playwright E2E
        run: cd tests && npx playwright test --project=e2e-chromium

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: playwright-report
          # html report + raw traces/videos (test-results) — both are needed to
          # debug a red run offline.
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 3

  check-scope:
    name: Check the scope
    runs-on: ubuntu-latest
    outputs:
      run-all: ${{
          endsWith(github.ref, '/master') ||
          endsWith(github.ref, '/develop') ||
          contains(github.ref, '/release/') ||
          inputs['test-all'] == true
        }}
      build-handsontable-es-cjs: ${{ steps.path-filter.outputs.build-handsontable-es-cjs }}
      build-handsontable-umd: ${{ steps.path-filter.outputs.build-handsontable-umd }}
      test-handsontable-unit: ${{ steps.path-filter.outputs.test-handsontable-unit }}
      test-handsontable-types: ${{ steps.path-filter.outputs.test-handsontable-types }}
      test-handsontable-walkontable: ${{ steps.path-filter.outputs.test-handsontable-walkontable }}
      test-handsontable-e2e: ${{ steps.path-filter.outputs.test-handsontable-e2e }}
      test-handsontable-e2e-min: ${{ steps.path-filter.outputs.test-handsontable-e2e-min }}
      test-angular-wrapper: ${{ steps.path-filter.outputs.test-angular-wrapper }}
      test-react-wrapper: ${{ steps.path-filter.outputs.test-react-wrapper }}
      test-vue3: ${{ steps.path-filter.outputs.test-vue3 }}
      test-visual: ${{ steps.path-filter.outputs.test-visual }}
      test-performance: ${{ steps.path-filter.outputs.test-performance }}
      verify-types: ${{ steps.path-filter.outputs.verify-types }}
      docs-angular: ${{ steps.path-filter.outputs.docs-angular }}
      pkg-preview: ${{ steps.path-filter.outputs.pkg-preview }}
      docs: ${{ steps.path-filter.outputs.docs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        if: ${{ inputs['test-all'] != true }}
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # https://github.com/dorny/paths-filter/releases/tag/v4.0.1
        id: path-filter
        if: ${{ inputs['test-all'] != true }}
        with:
          filters: |
            config-files: &config-files
              - './handsontable/.config/**'
              - './handsontable/package.json'
              - './package-lock.json'
              - './handsontable/hot.config.js'
              - './handsontable/babel.config.js'
              - './.github/workflows/test.yml'
              - './visual-tests/playwright.config.ts'
              - './visual-tests/playwright-cross-browser.config.ts'
            hot-definition-files: &hot-definition-files
              - './handsontable/base.d.ts'
              - './handsontable/handsontable.d.ts'
            hot-source-and-scripts: &hot-source-and-scripts
              - './handsontable/src/**'
              - './handsontable/scripts/**'
            hot-shared: &hot-shared
              - *config-files
              - *hot-source-and-scripts
            hot-e2e-test-shared: &hot-e2e-test-shared
              - './handsontable/test/e2e/**'
              - './handsontable/test/scripts/**'
            build-handsontable-umd:
              - *hot-shared
              - './handsontable/test/e2e/**'
              - './handsontable/test/scripts/**'
              - './examples/next/visual-tests/**'
              # The Playwright tier drives the built dist, so a tests-only PR
              # must still produce the UMD artifact (and thereby run the
              # test-e2e-playwright job, which keys off this output).
              - './tests/**'
            build-handsontable-es-cjs:
              - *hot-shared
              - 'wrappers/**'
              - './examples/next/visual-tests/**'
            test-handsontable-unit:
              - *hot-shared
              - './handsontable/test/unit/**'
            test-handsontable-types:
              - *hot-shared
              - *hot-definition-files
              - './handsontable/test/types/**'
            test-handsontable-walkontable:
              - './handsontable/.config/**'
              - './handsontable/test/scripts/**'
              - './handsontable/src/3rdparty/walkontable/**'
            test-handsontable-e2e:
              - *hot-shared
              - *hot-e2e-test-shared
            test-handsontable-e2e-min:
              - *hot-shared
              - *hot-e2e-test-shared
            test-angular-wrapper:
              - *hot-shared
              - 'wrappers/angular-wrapper/**'
            test-react-wrapper:
              - *hot-shared
              - 'wrappers/react-wrapper/**'
            test-vue3:
              - *hot-shared
              - 'wrappers/vue3/**'
            test-visual:
              - './examples/next/visual-tests/**'
              - './visual-tests/**'
            test-performance:
              - './handsontable/src/**'
              - './performance-tests/**'
              - './.github/workflows/performance-tests.yml'
            verify-types:
              - './handsontable/**'
              - './.github/workflows/verify-emitted-types.yml'
            docs-angular:
              - './docs/content/**/angular/*.ts'
              - './docs/angular-type-check/**'
              - './handsontable/**'
              - './wrappers/angular-wrapper/**'
            pkg-preview:
              - './handsontable/**'
              - './wrappers/**'
            docs:
              - './docs/**'
              - './handsontable/package.json'

  # ── Fragments: every former standalone PR workflow is its own yml file with a
  # `workflow_call` trigger, called from here — the PR gets ONE pipeline, the
  # implementations stay modular. Files keep their push-to-trunk baselines
  # where they had one.

  # Manual-QA: the tracked human exception, evaluated INSIDE this pipeline (no
  # separate workflow/triggers). The PR template carries a tickbox — ticking
  # "needs a manual QA pass" turns this job RED until a human who is NOT the
  # PR author comments `/manual-qa passed`; then re-run this job (it reads the
  # LIVE body + comments via the API, not the frozen event payload). Unticked
  # PRs pass immediately, so the check is safe to make required later.
  manual-qa:
    name: "[CHECK] Manual QA"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Evaluate the manual-QA tickbox and sign-off
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # https://github.com/actions/github-script/releases/tag/v8.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const ticked = /^\s*-\s*\[[xX]\]\s+This change needs a manual QA pass/m.test(pr.body || '');
            if (!ticked) { core.notice('Manual QA not requested.'); return; }

            // Sign-off = a `/manual-qa passed` comment from someone who is NOT
            // the PR author — comment authorship is API-verified identity,
            // unlike labels or checkbox edits.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr.number, per_page: 100,
            });
            const signOff = comments.reverse().find(c =>
              /^\/manual-qa passed\b/m.test(c.body || '') && c.user.login !== pr.user.login);
            if (signOff) {
              core.notice(`Manual QA signed off by @${signOff.user.login}.`);
              return;
            }
            core.setFailed('Manual QA requested (tickbox in the PR description) but not signed off yet. '
              + 'A reviewer who is not the author must comment "/manual-qa passed", then re-run this job.');

  changelog:
    name: "Changelog"
    # PR-only. The workflow deliberately does NOT subscribe to `edited`: a body
    # edit adding `[skip changelog]` after a red check is rare — re-run the
    # failed job instead. Subscribing would spawn a run row on every description
    # edit (incl. every bugbot summary injection).
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/changelog.yml
    secrets: inherit

  lint:
    name: "Lint"
    # Was linter.yml (`on: [push]` — every branch). Decision (2026-07-14):
    # lint is a PR gate ONLY — no trunk/release/rc/stable runs; a merged PR
    # already proved it.
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/linter.yml
    secrets: inherit

  audit:
    name: "Audit (warn)"
    # Was audit.yml (`on: [push]`). Non-blocking by design (~380 known vulns to
    # burn down first). PR-only, like lint.
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/audit.yml
    secrets: inherit

  visual-tests-lint:
    name: "Lint visual tests"
    needs: [ check-scope ]
    # Was visual-tests-linter.yml (push touching visual-tests/** + every PR).
    # Decision (2026-07-14): PR-only, scope-gated — no trunk runs.
    if: |
      github.event_name == 'pull_request' && (
        needs.check-scope.outputs.run-all == 'true' ||
        needs.check-scope.outputs.test-visual == 'true'
      )
    uses: ./.github/workflows/visual-tests-linter.yml
    secrets: inherit

  # ── Former standalone workflows, now reusable fragments of this pipeline ─────
  # Each keeps its own file (and its push-to-develop baseline where it had one);
  # on PRs they run as part of THIS pipeline, scope-gated by the router.

  code-quality:
    name: "Code Quality"
    needs: [ check-scope ]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  performance:
    name: "Performance"
    needs: [ check-scope, build-handsontable-umd ]
    # !failure() && !cancelled(): still run when the build was SKIPPED (e.g. a
    # perf-tests-only PR) — the fragment then builds for itself.
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'pull_request' && (
        needs.check-scope.outputs.run-all == 'true' ||
        needs.check-scope.outputs.test-performance == 'true'
      )
    uses: ./.github/workflows/performance-tests.yml
    with:
      hot-prebuilt: ${{ needs.build-handsontable-umd.result == 'success' }}
    secrets: inherit

  verify-emitted-types:
    name: "Verify types"
    needs: [ check-scope, build-handsontable-es-cjs ]
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'pull_request' && (
        needs.check-scope.outputs.run-all == 'true' ||
        needs.check-scope.outputs.verify-types == 'true'
      )
    uses: ./.github/workflows/verify-emitted-types.yml
    with:
      hot-prebuilt: ${{ needs.build-handsontable-es-cjs.result == 'success' }}
    secrets: inherit

  docs-angular-typecheck:
    name: "Docs Angular"
    needs: [ check-scope ]
    if: |
      github.event_name == 'pull_request' && (
        needs.check-scope.outputs.run-all == 'true' ||
        needs.check-scope.outputs.docs-angular == 'true'
      )
    uses: ./.github/workflows/docs-angular-typecheck.yml
    secrets: inherit

  docs-checks:
    name: "Docs checks"
    needs: [ check-scope ]
    # PRs + trunk pushes touching docs — mirrors the old standalone triggers
    # minus untargeted feature-branch pushes.
    if: |
      !failure() && !cancelled() &&
      (github.event_name == 'pull_request' || github.event_name == 'push') && (
        needs.check-scope.outputs.run-all == 'true' && github.event_name == 'pull_request' ||
        needs.check-scope.outputs.docs == 'true'
      )
    uses: ./.github/workflows/docs-checks.yml
    secrets: inherit

  docs-preview:
    name: "Docs preview"
    needs: [ check-scope ]
    # Build-stage depth (needs only the router). Deploys the PR's Cloudflare
    # Pages preview; trunk/staging deploys stay on docs-staging.yml's own push
    # trigger (develop + release/**), unchanged.
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.check-scope.outputs.docs == 'true'
    uses: ./.github/workflows/docs-staging.yml
    secrets: inherit

  docs-visual:
    name: "Docs visual"
    needs: [ check-scope, docs-preview ]
    # Test-stage depth, targeting the preview just deployed. Label-gated INSIDE
    # the fragment (live API check): add the `run-docs-visual` label to the PR
    # and press "Re-run all jobs" — the gate reads current labels, not the
    # frozen event payload, so the re-run picks it up.
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.check-scope.outputs.docs == 'true' &&
      needs.docs-preview.result == 'success'
    uses: ./.github/workflows/docs-visual-tests.yml
    with:
      test-url: ${{ needs.docs-preview.outputs.preview-url }}
      require-label: true
    secrets: inherit

  pkg-pr-new:
    name: "Preview packages"
    needs: [ check-scope, build-handsontable-es-cjs ]
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'pull_request' && (
        needs.check-scope.outputs.run-all == 'true' ||
        needs.check-scope.outputs.pkg-preview == 'true'
      )
    uses: ./.github/workflows/pkg-pr-new.yml
    with:
      hot-prebuilt: ${{ needs.build-handsontable-es-cjs.result == 'success' }}
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  build-handsontable-umd:
    name: "[BUILD] UMD"
    runs-on: ubuntu-latest
    needs: [ check-scope ]
    if: |
      needs.check-scope.outputs.run-all == 'true' ||
      needs.check-scope.outputs.build-handsontable-umd == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # https://github.com/pnpm/action-setup/releases/tag/v6.0.8
        name: Install pnpm

      - name: Use Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # https://github.com/actions/setup-node/releases/tag/v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build
        run: |
          cd handsontable
          npm run build:umd
          npm run build:umd.min
          npm run build:languages
          npm run build:languages.min
      - run: tar -zcf dist.tar.gz ./handsontable/dist ./handsontable/styles

      - name: Upload the Handsontable UMD build artifact.
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: handsontable-build-umd
          path: dist.tar.gz

  build-handsontable-es-cjs:
    name: "[BUILD] ES + CJS"
    runs-on: ubuntu-latest
    needs: [ check-scope ]
    if: |
      needs.check-scope.outputs.run-all == 'true' ||
      needs.check-scope.outputs.build-handsontable-es-cjs == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # https://github.com/pnpm/action-setup/releases/tag/v6.0.8
        name: Install pnpm

      - name: Use Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # https://github.com/actions/setup-node/releases/tag/v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build
        run: |
          cd handsontable
          npm run build:es
          npm run build:commonjs
          npm run build:types
          node scripts/run.mjs downlevel:types
          npm run build:languages.es
          npm run build:languages
          npm run build:languages.min
          npm run postbuild
      - run: tar -zcf tmp.tar.gz ./handsontable/tmp

      - name: Upload the Handsontable ES + CJS build artifact.
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: handsontable-build-es-cjs
          path: tmp.tar.gz

  test-handsontable-unit:
    name: "[TEST] Unit"
    runs-on: ubuntu-latest
    needs: [ check-scope ]
    if: |
      needs.check-scope.outputs.run-all == 'true' ||
      needs.check-scope.outputs.test-handsontable-unit == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # https://github.com/pnpm/action-setup/releases/tag/v6.0.8
        name: Install pnpm

      - name: Use Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # https://github.com/actions/setup-node/releases/tag/v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Test
        run: |
          cd handsontable
          npm run test:unit

  test-handsontable-types:
    name: "[TEST] Types"
    runs-on: ubuntu-latest
    needs: [ check-scope ]
    if: |
      needs.check-scope.outputs.run-all == 'true' ||
      needs.check-scope.outputs.test-handsontable-types == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # https://github.com/pnpm/action-setup/releases/tag/v6.0.8
        name: Install pnpm

      - name: Use Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # https://github.com/actions/setup-node/releases/tag/v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Test
        run: |
          cd handsontable
          npm run test:types

  # The engine builds in the Build stage like every other bundle — the artifact
  # (standalone walkontable.js/css + the spec bundle) is consumed by the test
  # job below, and later by the Playwright Core-fixture harness (DEV-2065).
  build-walkontable:
    name: "[BUILD] Walkontable engine"
    runs-on: ubuntu-latest
    needs: [ check-scope ]
    if: |
      needs.check-scope.outputs.run-all == 'true' ||
      needs.check-scope.outputs.test-handsontable-walkontable == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # https://github.com/pnpm/action-setup/releases/tag/v6.0.8
        name: Install pnpm

      - name: Use Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # https://github.com/actions/setup-node/releases/tag/v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install

      - name: Build the engine + spec bundle
        run: |
          cd handsontable
          node scripts/run.mjs build:walkontable
          node scripts/run.mjs test:walkontable.dump

      - run: tar -zcf walkontable.tar.gz ./handsontable/src/3rdparty/walkontable/dist ./handsontable/src/3rdparty/walkontable/test/dist

      - name: Upload the Walkontable engine artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # https://github.com/actions/upload-artifact/releases/tag/v7.0.0
        with:
          name: walkontable-build
          path: walkontable.tar.gz

  test-handsontable-walkontable:
    name: "[TEST] Walkontable"
    runs-on: ubuntu-latest
    needs: [ check-scope, build-walkontable ]
    if: |
      needs.check-scope.outputs.run-all == 'true' ||
      needs.check-scope.outputs.test-handsontable-walkontable == 'true'
    steps:
